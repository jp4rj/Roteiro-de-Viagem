<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#667eea">
<title>Planejador de Viagem</title>

<!-- jsPDF (PDF) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 20px; color: #333;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { color: white; text-align: center; margin-bottom: 20px; font-size: 2em; }
  .card {
    background: white; border-radius: 12px; padding: 20px;
    margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .card h2 {
    color: #667eea; margin-bottom: 15px; font-size: 1.2em;
    border-bottom: 2px solid #f0f0f0; padding-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  label { display: block; font-size: 0.85em; font-weight: 600; margin-bottom: 4px; color: #555; }
  input, select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid #ddd;
    border-radius: 6px; font-size: 0.95em; font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: #667eea; }
  button {
    background: #667eea; color: white; border: none; padding: 10px 20px;
    border-radius: 6px; cursor: pointer; font-size: 0.95em;
    font-weight: 600; transition: background 0.2s;
  }
  button:hover { background: #5568d3; }
  button.secondary { background: #e0e0e0; color: #333; }
  button.secondary:hover { background: #d0d0d0; }
  button.danger { background: #ff4757; padding: 6px 12px; font-size: 0.85em; }
  button.danger:hover { background: #ee3546; }
  button.small { padding: 6px 12px; font-size: 0.85em; }
  .item-row {
    display: flex; gap: 8px; align-items: center; padding: 10px;
    background: #f8f9fa; border-radius: 6px; margin-bottom: 8px;
  }
  .item-row .item-info { flex: 1; }
  .item-row .item-title { font-weight: 600; }
  .item-row .item-detail { font-size: 0.85em; color: #666; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .badge {
    display: inline-block; background: #667eea; color: white;
    padding: 3px 8px; border-radius: 12px; font-size: 0.75em; margin-left: 8px;
  }
  .badge.cinza { background: #999; }
  .bagagem-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .bagagem-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  .bagagem-item label { margin: 0; cursor: pointer; font-weight: normal; }
  .bagagem-item.done label { text-decoration: line-through; color: #999; }
  .empty { color: #999; font-style: italic; padding: 10px; text-align: center; }

  .cidade-card {
    background: #fafbff; border: 2px solid #e0e6ff;
    border-radius: 10px; padding: 15px; margin-bottom: 15px;
    position: relative;
  }
  .cidade-card.dragging { opacity: 0.4; }
  .cidade-card.drag-over { border-color: #667eea; background: #eef1ff; }
  .cidade-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed #ccc;
    gap: 10px; flex-wrap: wrap;
  }
  .cidade-header h3 { color: #764ba2; font-size: 1.1em; flex: 1; }
  .cidade-header small { color: #888; font-weight: normal; font-size: 0.85em; }
  .drag-handle {
    cursor: grab; font-size: 1.4em; color: #999; user-select: none;
    padding: 0 8px;
  }
  .drag-handle:active { cursor: grabbing; }
  .subtitulo {
    font-size: 0.9em; color: #667eea; font-weight: 700;
    margin: 15px 0 8px; display: flex; align-items: center; gap: 8px;
  }
  .subtitulo::before { content: ''; width: 4px; height: 16px; background: #667eea; border-radius: 2px; }

  /* TIMELINE */
  .timeline { position: relative; padding-left: 30px; margin-top: 15px; }
  .timeline::before {
    content: ''; position: absolute; left: 8px; top: 0; bottom: 0;
    width: 3px; background: linear-gradient(180deg, #667eea, #764ba2);
    border-radius: 2px;
  }
  .timeline-dia { margin-bottom: 20px; position: relative; }
  .timeline-dia::before {
    content: ''; position: absolute; left: -26px; top: 6px;
    width: 14px; height: 14px; background: #667eea;
    border: 3px solid white; border-radius: 50%;
    box-shadow: 0 0 0 2px #667eea;
  }
  .timeline-dia h4 {
    color: #764ba2; font-size: 1em; margin-bottom: 8px;
    background: #f0f4ff; padding: 6px 10px; border-radius: 6px;
  }
  .timeline-evento {
    background: white; padding: 8px 12px; border-radius: 6px;
    margin-bottom: 6px; border-left: 3px solid #667eea;
    font-size: 0.9em; display: flex; gap: 8px; align-items: center;
  }
  .timeline-evento .hora {
    font-weight: 700; color: #667eea; min-width: 55px;
  }
  .timeline-evento.transporte { border-left-color: #f59e0b; }
  .timeline-evento.hotel { border-left-color: #10b981; }
  .timeline-evento.local { border-left-color: #667eea; }

  /* ORÇAMENTO */
  .orcamento-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; margin-top: 12px;
  }
  .orcamento-item {
    background: #f8f9fa; padding: 12px; border-radius: 8px;
    border-left: 4px solid #667eea;
  }
  .orcamento-item .label { font-size: 0.8em; color: #666; text-transform: uppercase; font-weight: 600; }
  .orcamento-item .valor { font-size: 1.3em; font-weight: 700; color: #333; margin-top: 4px; }
  .orcamento-item.transporte { border-left-color: #f59e0b; }
  .orcamento-item.hotel { border-left-color: #10b981; }
  .orcamento-item.alimentacao { border-left-color: #ef4444; }
  .orcamento-item.passeios { border-left-color: #8b5cf6; }
  .orcamento-item.total { border-left-color: #667eea; background: #eef1ff; }

  /* CONEXAO ENTRE CIDADES */
  .conexao {
    text-align: center; padding: 8px; margin: 8px 0;
    background: #fff3e0; border-radius: 8px;
    color: #e65100; font-size: 0.85em; font-weight: 600;
    border: 2px dashed #ffb74d;
  }

  /* BOTÃO FLUTUANTE PDF */
  .fab {
    position: fixed; bottom: 20px; right: 20px;
    width: 60px; height: 60px; border-radius: 50%;
    background: #ef4444; color: white; font-size: 1.5em;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: none;
  }
  .fab:hover { background: #dc2626; transform: scale(1.05); }

  @media (max-width: 600px) {
    .item-row { flex-wrap: wrap; }
    h1 { font-size: 1.5em; }
    .timeline { padding-left: 24px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>✈️ Planejador de Viagem</h1>

  <!-- ========== CONFIGURAÇÃO ========== -->
  <div class="card">
    <h2>🎯 Configuração da Viagem</h2>
    <div class="grid">
      <div><label>Nome / Destino geral</label><input id="destino" placeholder="Ex: Europa 2026"></div>
      <div><label>Data de ida</label><input id="dataIda" type="date"></div>
      <div><label>Data de volta</label><input id="dataVolta" type="date"></div>
      <div><label>Quantidade de dias</label><input id="dias" type="number" min="1" value="3"></div>
      <div>
        <label>Tipo de viagem</label>
        <select id="tipoViagem">
          <option value="lazer">Lazer</option><option value="negocios">Negócios</option>
          <option value="aventura">Aventura</option><option value="praia">Praia</option>
          <option value="cultural">Cultural</option><option value="mochilao">Mochilão</option>
        </select>
      </div>
      <div>
        <label>Clima esperado</label>
        <select id="clima">
          <option value="quente">Quente</option><option value="frio">Frio</option>
          <option value="ameno">Ameno</option><option value="chuva">Chuvoso</option>
        </select>
      </div>
    </div>
    <div class="actions">
      <button onclick="atualizarTudo()">🔄 Atualizar / Gerar Bagagem</button>
      <button class="secondary" onclick="salvarLocal()">💾 Salvar</button>
    </div>
  </div>

  <!-- ========== CIDADES ========== -->
  <div class="card">
    <h2>🏙️ Cidades da Viagem <span class="badge" id="badgeCidades">0</span></h2>
    <p style="font-size:0.85em;color:#888;margin-bottom:10px;">💡 Arraste o ícone <strong>⋮⋮</strong> para reordenar a sequência das cidades.</p>
    <div class="grid">
      <div><label>Nome da cidade</label><input id="cidade_nome" placeholder="Ex: Lisboa"></div>
      <div><label>Chegada</label><input id="cidade_chegada" type="date"></div>
      <div><label>Saída</label><input id="cidade_saida" type="date"></div>
    </div>
    <div class="actions"><button onclick="addCidade()">+ Adicionar Cidade</button></div>
    <div id="listaCidades" style="margin-top:15px;"></div>
  </div>

  <!-- ========== ROTEIRO POR DIA ========== -->
  <div class="card">
    <h2>📅 Roteiro por Dia (Timeline)</h2>
    <div id="timeline"></div>
  </div>

  <!-- ========== ORÇAMENTO ========== -->
  <div class="card">
    <h2>💰 Orçamento Detalhado</h2>
    <div class="grid">
      <div>
        <label>Alimentação (R$/dia por pessoa)</label>
        <input id="orc_alimentacao" type="number" value="150" onchange="render()">
      </div>
      <div>
        <label>Passeios (R$ total)</label>
        <input id="orc_passeios" type="number" value="500" onchange="render()">
      </div>
      <div>
        <label>Extras (compras, imprevistos)</label>
        <input id="orc_extras" type="number" value="300" onchange="render()">
      </div>
    </div>
    <div id="orcamento" class="orcamento-grid"></div>
  </div>

  <!-- ========== BAGAGEM ========== -->
  <div class="card">
    <h2>🎒 Bagagem <span class="badge" id="badgeBagagem">0 itens</span></h2>
    <div class="actions" style="margin-bottom:12px;">
      <button onclick="gerarBagagem()">🔄 Regenerar</button>
      <button class="secondary" onclick="limparBagagem()">🗑️ Limpar</button>
    </div>
    <div id="listaBagagem"></div>
  </div>
</div>

<button class="fab" onclick="exportarPDF()" title="Exportar PDF">📄</button>

<script>
// ================= ESTADO =================
let estado = {
  bagagem: [],
  cidades: [],
  orcamento: { alimentacao: 150, passeios: 500, extras: 300 }
};

// ================= PERSISTÊNCIA =================
function salvarLocal() {
  localStorage.setItem('viagemApp', JSON.stringify(estado));
  alert('✅ Dados salvos!');
}
function carregarLocal() {
  const dados = localStorage.getItem('viagemApp');
  if (dados) {
    try {
      const parsed = JSON.parse(dados);
      estado = { ...estado, ...parsed };
      if (!estado.cidades) estado.cidades = [];
      if (!estado.orcamento) estado.orcamento = { alimentacao: 150, passeios: 500, extras: 300 };
      estado.cidades.forEach(c => {
        if (!c.transporte) c.transporte = [];
        if (!c.hotel) c.hotel = [];
        if (!c.locais) c.locais = [];
      });
    } catch(e) {}
  }
  if (estado.orcamento) {
    document.getElementById('orc_alimentacao').value = estado.orcamento.alimentacao;
    document.getElementById('orc_passeios').value = estado.orcamento.passeios;
    document.getElementById('orc_extras').value = estado.orcamento.extras;
  }
}

// ================= CIDADES =================
function addCidade() {
  const nome = document.getElementById('cidade_nome').value.trim();
  const chegada = document.getElementById('cidade_chegada').value;
  const saida = document.getElementById('cidade_saida').value;
  if (!nome) return alert('Informe o nome da cidade.');
  estado.cidades.push({
    nome, chegada, saida,
    transporte: [], hotel: [], locais: [],
    conexao: null
  });
  document.getElementById('cidade_nome').value = '';
  document.getElementById('cidade_chegada').value = '';
  document.getElementById('cidade_saida').value = '';
  render();
}
function removerCidade(idx) {
  if (confirm('Remover cidade e tudo dentro dela?')) {
    estado.cidades.splice(idx, 1);
    render();
  }
}
function moverCidade(from, to) {
  if (from === to) return;
  const item = estado.cidades.splice(from, 1)[0];
  estado.cidades.splice(to, 0, item);
  render();
}

// ================= TRANSPORTE/HOTEL/LOCAL =================
function addTransporte(cIdx) {
  const tipo = document.getElementById(`transp_tipo_${cIdx}`).value;
  const empresa = document.getElementById(`transp_empresa_${cIdx}`).value.trim();
  const ida = document.getElementById(`transp_ida_${cIdx}`).value.trim();
  const volta = document.getElementById(`transp_volta_${cIdx}`).value.trim();
  const custo = parseFloat(document.getElementById(`transp_custo_${cIdx}`).value) || 0;
  if (!empresa && !ida) return alert('Preencha empresa ou ida.');
  estado.cidades[cIdx].transporte.push({ tipo, empresa, ida, volta, custo });
  render();
}
function addHotel(cIdx) {
  const nome = document.getElementById(`hotel_nome_${cIdx}`).value.trim();
  const end = document.getElementById(`hotel_end_${cIdx}`).value.trim();
  const checkin = document.getElementById(`hotel_in_${cIdx}`).value;
  const checkout = document.getElementById(`hotel_out_${cIdx}`).value;
  const custo = parseFloat(document.getElementById(`hotel_custo_${cIdx}`).value) || 0;
  if (!nome) return alert('Informe o nome do hotel.');
  estado.cidades[cIdx].hotel.push({ nome, end, checkin, checkout, custo });
  render();
}
function addLocal(cIdx) {
  const nome = document.getElementById(`local_nome_${cIdx}`).value.trim();
  const data = document.getElementById(`local_data_${cIdx}`).value;
  const hora = document.getElementById(`local_hora_${cIdx}`).value.trim();
  const cat = document.getElementById(`local_cat_${cIdx}`).value;
  if (!nome) return alert('Informe o nome do local.');
  estado.cidades[cIdx].locais.push({ nome, data, hora, cat });
  render();
}
function remover(cIdx, tipo, i) {
  estado.cidades[cIdx][tipo].splice(i, 1);
  render();
}

// ================= CONEXÃO ENTRE CIDADES =================
function setConexao(cIdx) {
  const tipo = document.getElementById(`conexao_tipo_${cIdx}`).value;
  const custo = parseFloat(document.getElementById(`conexao_custo_${cIdx}`).value) || 0;
  estado.cidades[cIdx].conexao = { tipo, custo };
  render();
}

// ================= BAGAGEM =================
function gerarBagagem() {
  const tipo = document.getElementById('tipoViagem').value;
  const clima = document.getElementById('clima').value;
  const dias = Math.max(1, parseInt(document.getElementById('dias').value) || 1);

  const base = ['Escova de dentes', 'Pasta de dente', 'Desodorante', 'Shampoo',
    'Documentos (RG/Passaporte)', 'Celular + carregador', 'Carteira', 'Remédios pessoais'];
  const roupaBase = dias <= 2 ? 2 : Math.min(dias, 7);
  let roupas = ['Cuecas/calcinhas x' + (roupaBase+1), 'Meias x' + (roupaBase+1), 'Camisetas x' + (roupaBase+1)];
  let extras = [];
  let calcados = ['Tênis confortável'];

  if (clima === 'quente') {
    roupas.push('Bermudas/shorts x' + roupaBase);
    extras.push('Protetor solar', 'Óculos de sol', 'Boné/chapéu', 'Repelente');
    calcados.push('Chinelo/sandália');
  } else if (clima === 'frio') {
    roupas.push('Calças x' + roupaBase, 'Casacos/blusas x' + Math.min(dias, 3), 'Suéteres');
    extras.push('Luvas', 'Cachecol', 'Gorro', 'Hidratante labial');
    calcados.push('Botas/calçado fechado');
  } else if (clima === 'chuva') {
    extras.push('Guarda-chuva', 'Capa de chuva', 'Sapato impermeável');
    roupas.push('Calças x' + roupaBase, 'Jaqueta impermeável');
  } else {
    roupas.push('Calças x' + roupaBase, 'Jaqueta leve');
  }

  if (tipo === 'negocios') {
    roupas.push('Traje social/terno', 'Camisa social x' + Math.min(dias, 3));
    extras.push('Notebook + carregador', 'Cartões de visita', 'Pasta/porta-documentos');
    calcados.push('Sapato social');
  } else if (tipo === 'praia') {
    extras.push('Maiô/sunga', 'Toalha de praia', 'Protetor solar FPS 50+', 'Bolsa térmica');
    calcados = ['Chinelo', 'Sandália'];
  } else if (tipo === 'aventura') {
    extras.push('Mochila pequena', "Garrafa d'água", 'Lanterna', 'Canivete', 'Kit primeiros socorros', 'Repelente');
    calcados.push('Bota de trilha');
  } else if (tipo === 'mochilao') {
    extras.push('Mochila cargueira', 'Cadeado para mochila', 'Saco de dormir leve', 'Toalha rápida', 'Adaptador de tomada');
    calcados.push('Sandália');
  } else if (tipo === 'cultural') {
    extras.push('Guia/caderno', 'Câmera fotográfica', 'Roupas confortáveis para caminhar');
  } else {
    extras.push('Roupas casuais extras', 'Livro/entretenimento');
  }
  extras.push('Seguro viagem', 'Reservas impressas');

  estado.bagagem = [
    ...base.map(t => ({ item: t, cat: 'Essenciais', done: false })),
    ...roupas.map(t => ({ item: t, cat: 'Roupas', done: false })),
    ...calcados.map(t => ({ item: t, cat: 'Calçados', done: false })),
    ...extras.map(t => ({ item: t, cat: 'Extras', done: false }))
  ];
  render();
}
function limparBagagem() {
  if (confirm('Limpar toda a bagagem?')) { estado.bagagem = []; render(); }
}
function toggleBagagem(i) { estado.bagagem[i].done = !estado.bagagem[i].done; render(); }

// ================= RENDER PRINCIPAL =================
function render() {
  renderCidades();
  renderTimeline();
  renderBagagem();
  renderOrcamento();
  estado.orcamento.alimentacao = parseFloat(document.getElementById('orc_alimentacao').value) || 0;
  estado.orcamento.passeios = parseFloat(document.getElementById('orc_passeios').value) || 0;
  estado.orcamento.extras = parseFloat(document.getElementById('orc_extras').value) || 0;
}

// ---- CIDADES ----
function renderCidades() {
  const box = document.getElementById('listaCidades');
  document.getElementById('badgeCidades').textContent = `${estado.cidades.length} cidade(s)`;

  if (estado.cidades.length === 0) {
    box.innerHTML = '<div class="empty">Nenhuma cidade adicionada</div>';
    return;
  }

  box.innerHTML = estado.cidades.map((c, cIdx) => {
    const diasCidade = (c.chegada && c.saida)
      ? Math.max(1, Math.ceil((new Date(c.saida) - new Date(c.chegada)) / 86400000) + 1)
      : '—';

    const conexaoHtml = cIdx > 0 ? `
      <div class="conexao">
        ⬇️ Conexão: ${estado.cidades[cIdx-1].nome} → ${c.nome}
        <div class="grid" style="margin-top:8px;">
          <div>
            <select id="conexao_tipo_${cIdx}">
              ${['Avião','Trem','Ônibus','Carro','Barco'].map(t =>
                `<option ${c.conexao?.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}
            </select>
          </div>
          <div>
            <input id="conexao_custo_${cIdx}" type="number" placeholder="Custo R$"
                   value="${c.conexao?.custo || 0}">
          </div>
          <div>
            <button class="small" onclick="setConexao(${cIdx})">Definir conexão</button>
          </div>
        </div>
      </div>
    ` : '';

    return `
    ${conexaoHtml}
    <div class="cidade-card" draggable="true"
         ondragstart="onDragStart(event, ${cIdx})"
         ondragover="onDragOver(event)"
         ondragleave="onDragLeave(event)"
         ondrop="onDrop(event, ${cIdx})"
         ondragend="onDragEnd(event)">
      <div class="cidade-header">
        <span class="drag-handle" title="Arraste para reordenar">⋮⋮</span>
        <h3>${cIdx + 1}. ${c.nome} <small>(${diasCidade} dia(s) · ${c.locais.length} local(is))</small></h3>
        <button class="danger" onclick="removerCidade(${cIdx})">Remover</button>
      </div>

      <!-- Transporte -->
      <div class="subtitulo">🚗 Transporte</div>
      <div class="grid">
        <div><label>Tipo</label><select id="transp_tipo_${cIdx}">
          <option>Avião</option><option>Trem</option><option>Ônibus</option><option>Carro</option><option>Barco</option>
        </select></div>
        <div><label>Empresa</label><input id="transp_empresa_${cIdx}" placeholder="Ex: TAP"></div>
        <div><label>Ida</label><input id="transp_ida_${cIdx}" placeholder="Ex: 10/05 08:30"></div>
        <div><label>Volta</label><input id="transp_volta_${cIdx}" placeholder="Ex: 15/05 18:00"></div>
        <div><label>Custo (R$)</label><input id="transp_custo_${cIdx}" type="number" placeholder="0"></div>
      </div>
      <div class="actions"><button class="small" onclick="addTransporte(${cIdx})">+ Transporte</button></div>
      <div style="margin-top:10px;">
        ${c.transporte.length === 0 ? '<div class="empty">Sem transporte</div>' :
          c.transporte.map((t, i) => `
            <div class="item-row">
              <div class="item-info">
                <div class="item-title">${t.tipo} - ${t.empresa || '—'}</div>
                <div class="item-detail">Ida: ${t.ida || '—'} | Volta: ${t.volta || '—'} | R$ ${t.custo.toFixed(2)}</div>
              </div>
              <button class="danger" onclick="remover(${cIdx}, 'transporte', ${i})">x</button>
            </div>`).join('')}
      </div>

      <!-- Hotel -->
      <div class="subtitulo">🏨 Hospedagem</div>
      <div class="grid">
        <div><label>Nome</label><input id="hotel_nome_${cIdx}" placeholder="Ex: Hotel Central"></div>

        <div><label>Check-in</label><input id="hotel_in_${cIdx}" type="date"></div>
        <div><label>Check-out</label><input id="hotel_out_${cIdx}" type="date"></div>
        <div><label>R$/noite</label><input id="hotel_custo_${cIdx}" type="number" placeholder="0"></div>
      </div>
      <div class="actions"><button class="small" onclick="addHotel(${cIdx})">+ Hotel</button></div>
      <div style="margin-top:10px;">
        ${c.hotel.length === 0 ? '<div class="empty">Sem hotel</div>' :
          c.hotel.map((h, i) => `
            <div class="item-row">
              <div class="item-info">
                <div class="item-title">${h.nome}</div>
                <div class="item-detail">${h.end || '—'} | In: ${h.checkin || '—'} | Out: ${h.checkout || '—'} | R$ ${h.custo.toFixed(2)}/noite</div>
              </div>
              <button class="danger" onclick="remover(${cIdx}, 'hotel', ${i})">x</button>
            </div>`).join('')}
      </div>

      <!-- Locais -->
      <div class="subtitulo">📍 Locais</div>
      <div class="grid">
        <div><label>Local</label><input id="local_nome_${cIdx}" placeholder="Ex: Torre de Belém"></div>
        <div><label>Data</label><input id="local_data_${cIdx}" type="date"></div>
        <div><label>Horário</label><input id="local_hora_${cIdx}" placeholder="Ex: 10:00"></div>
        <div><label>Categoria</label><select id="local_cat_${cIdx}">
          <option>Turismo</option><option>Gastronomia</option><option>Compras</option><option>Cultura</option><option>Natureza</option>
        </select></div>
      </div>
      <div class="actions"><button class="small" onclick="addLocal(${cIdx})">+ Local</button></div>
      <div style="margin-top:10px;">
        ${c.locais.length === 0 ? '<div class="empty">Sem locais</div>' :
          c.locais.map((l, i) => `
            <div class="item-row">
              <div class="item-info">
                <div class="item-title">${l.nome} <span class="badge cinza">${l.cat}</span></div>
                <div class="item-detail">${l.data || '—'} ${l.hora ? 'às ' + l.hora : ''}</div>
              </div>
              <button class="danger" onclick="remover(${cIdx}, 'locais', ${i})">x</button>
            </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

// ================= TIMELINE =================
function renderTimeline() {
  const box = document.getElementById('timeline');
  const eventos = [];

  estado.cidades.forEach(c => {
    if (c.chegada) {
      eventos.push({
        data: c.chegada, hora: '', tipo: 'transporte',
        titulo: `Chegada em ${c.nome}`, sub: c.conexao ? `Conexão via ${c.conexao.tipo}` : ''
      });
    }
    c.transporte.forEach(t => {
      if (t.ida) {
        const [dataStr, hora] = t.ida.split(' ');
        eventos.push({
          data: dataStr, hora: hora || '', tipo: 'transporte',
          titulo: `${t.tipo} ${t.empresa || ''}`, sub: `Ida • ${c.nome}`
        });
      }
    });
    c.hotel.forEach(h => {
      if (h.checkin) {
        eventos.push({
          data: h.checkin, hora: '', tipo: 'hotel',
          titulo: `Check-in ${h.nome}`, sub: c.nome
        });
      }
    });
    c.locais.forEach(l => {
      if (l.data) {
        eventos.push({
          data: l.data, hora: l.hora || '', tipo: 'local',
          titulo: l.nome, sub: `${c.nome} • ${l.cat}`
        });
      }
    });
  });

  if (eventos.length === 0) {
    box.innerHTML = '<div class="empty">Adicione datas aos locais/transportes para ver a timeline</div>';
    return;
  }

  eventos.sort((a, b) => {
    const ka = (a.data || '') + ' ' + (a.hora || '00:00');
    const kb = (b.data || '') + ' ' + (b.hora || '00:00');
    return ka.localeCompare(kb);
  });

  const porDia = {};
  eventos.forEach(e => {
    if (!porDia[e.data]) porDia[e.data] = [];
    porDia[e.data].push(e);
  });

  box.innerHTML = '<div class="timeline">' + Object.entries(porDia).map(([data, evs]) => {
    const dt = new Date(data + 'T00:00:00');
    const diaSemana = dt.toLocaleDateString('pt-BR', { weekday: 'long' });
    const dataFmt = dt.toLocaleDateString('pt-BR');
    return `
      <div class="timeline-dia">
        <h4>📅 ${dataFmt} (${diaSemana})</h4>
        ${evs.map(e => `
          <div class="timeline-evento ${e.tipo}">
            <span class="hora">${e.hora || '—'}</span>
            <strong>${e.titulo}</strong>
            ${e.sub ? `<span style="color:#888;font-size:0.85em;">· ${e.sub}</span>` : ''}
          </div>
        `).join('')}
      </div>
    `;
  }).join('') + '</div>';
}

// ================= BAGAGEM =================
function renderBagagem() {
  const lb = document.getElementById('listaBagagem');
  document.getElementById('badgeBagagem').textContent =
    `${estado.bagagem.filter(b => !b.done).length} / ${estado.bagagem.length} itens`;

  if (estado.bagagem.length === 0) {
    lb.innerHTML = '<div class="empty">Clique em "Regenerar" para gerar a lista</div>';
    return;
  }
  const cats = {};
  estado.bagagem.forEach((b, i) => {
    if (!cats[b.cat]) cats[b.cat] = [];
    cats[b.cat].push({ ...b, idx: i });
  });
  lb.innerHTML = Object.entries(cats).map(([cat, itens]) => `
    <div style="margin-bottom:12px;">
      <strong style="color:#667eea;font-size:0.9em;">${cat}</strong>
      ${itens.map(it => `
        <div class="bagagem-item ${it.done ? 'done' : ''}">
          <input type="checkbox" ${it.done ? 'checked' : ''} onchange="toggleBagagem(${it.idx})">
          <label>${it.item}</label>
        </div>`).join('')}
    </div>`).join('');
}

// ================= ORÇAMENTO =================
function renderOrcamento() {
  const alim = parseFloat(document.getElementById('orc_alimentacao').value) || 0;
  const pas = parseFloat(document.getElementById('orc_passeios').value) || 0;
  const ext = parseFloat(document.getElementById('orc_extras').value) || 0;
  const dias = Math.max(1, parseInt(document.getElementById('dias').value) || 1);

  let custoTransp = 0, custoHotel = 0, custoConexao = 0;
  estado.cidades.forEach(c => {
    custoTransp += c.transporte.reduce((s, t) => s + t.custo, 0);
    custoHotel += c.hotel.reduce((s, h) => {
      if (h.checkin && h.checkout) {
        const d = Math.max(1, Math.ceil((new Date(h.checkout) - new Date(h.checkin)) / 86400000));
        return s + h.custo * d;
      }
      return s + h.custo;
    }, 0);
    if (c.conexao) custoConexao += c.conexao.custo;
  });

  const totalAlim = alim * dias;
  const total = custoTransp + custoHotel + custoConexao + totalAlim + pas + ext;

  document.getElementById('orcamento').innerHTML = `
    <div class="orcamento-item transporte">
      <div class="label">🚗 Transporte</div>
      <div class="valor">R$ ${(custoTransp + custoConexao).toFixed(2)}</div>
    </div>
    <div class="orcamento-item hotel">
      <div class="label">🏨 Hotel</div>
      <div class="valor">R$ ${custoHotel.toFixed(2)}</div>
    </div>
    <div class="orcamento-item alimentacao">
      <div class="label">🍽️ Alimentação (${dias}d)</div>
      <div class="valor">R$ ${totalAlim.toFixed(2)}</div>
    </div>
    <div class="orcamento-item passeios">
      <div class="label">🎟️ Passeios</div>
      <div class="valor">R$ ${pas.toFixed(2)}</div>
    </div>
    <div class="orcamento-item">
      <div class="label">🎁 Extras</div>
      <div class="valor">R$ ${ext.toFixed(2)}</div>
    </div>
    <div class="orcamento-item total">
      <div class="label">💰 TOTAL</div>
      <div class="valor">R$ ${total.toFixed(2)}</div>
    </div>
  `;
}

// ================= DRAG & DROP =================
let dragIdx = null;
function onDragStart(e, idx) { dragIdx = idx; e.currentTarget.classList.add('dragging'); }
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function onDrop(e, idx) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (dragIdx !== null && dragIdx !== idx) moverCidade(dragIdx, idx);
  dragIdx = null;
}
function onDragEnd(e) { e.currentTarget.classList.remove('dragging'); }

// ================= PDF =================
async function exportarPDF() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const pageW = 210, pageH = 297, margin = 15;
  let y = margin;

  const destino = document.getElementById('destino').value || 'Minha Viagem';
  const ida = document.getElementById('dataIda').value;
  const volta = document.getElementById('dataVolta').value;

  pdf.setFillColor(102, 126, 234);
  pdf.rect(0, 0, pageW, 35, 'F');
  pdf.setTextColor(255, 255, 255);
  pdf.setFontSize(22);
  pdf.setFont(undefined, 'bold');
  pdf.text('✈️ ' + destino, margin, 18);
  pdf.setFontSize(11);
  pdf.setFont(undefined, 'normal');
  pdf.text(`${ida || '?'} → ${volta || '?'}`, margin, 27);

  y = 45;
  pdf.setTextColor(0, 0, 0);

  const checkPage = (need = 10) => {
    if (y + need > pageH - margin) { pdf.addPage(); y = margin; }
  };

  for (let i = 0; i < estado.cidades.length; i++) {
    const c = estado.cidades[i];
    checkPage(40);
    pdf.setFillColor(240, 244, 255);
    pdf.rect(margin, y, pageW - 2*margin, 9, 'F');
    pdf.setFontSize(13);
    pdf.setFont(undefined, 'bold');
    pdf.setTextColor(118, 75, 162);
    pdf.text(`${i+1}. ${c.nome}  (${c.chegada || '?'} → ${c.saida || '?'})`, margin + 3, y + 6);
    y += 14;
    pdf.setTextColor(0, 0, 0);

    if (i > 0 && c.conexao) {
      checkPage(6);
      pdf.setFontSize(9);
      pdf.setFont(undefined, 'italic');
      pdf.text(`  ↳ Conexão: ${estado.cidades[i-1].nome} → ${c.nome} (${c.conexao.tipo}, R$ ${c.conexao.custo.toFixed(2)})`, margin + 3, y);
      y += 6;
    }

    if (c.transporte.length) {
      checkPage(8);
      pdf.setFontSize(10); pdf.setFont(undefined, 'bold');
      pdf.text('Transporte:', margin + 3, y); y += 5;
      pdf.setFont(undefined, 'normal'); pdf.setFontSize(9);
      c.transporte.forEach(t => {
        checkPage(5);
        pdf.text(`  • ${t.tipo} ${t.empresa || ''} | Ida: ${t.ida || '—'} | Volta: ${t.volta || '—'} | R$ ${t.custo.toFixed(2)}`, margin + 5, y);
        y += 5;
      });
    }

    if (c.hotel.length) {
      checkPage(8);
      pdf.setFontSize(10); pdf.setFont(undefined, 'bold');
      pdf.text('Hospedagem:', margin + 3, y); y += 5;
      pdf.setFont(undefined, 'normal'); pdf.setFontSize(9);
      c.hotel.forEach(h => {
        checkPage(5);
        pdf.text(`  • ${h.nome} | ${h.end || '—'} | ${h.checkin || '?'} a ${h.checkout || '?'} | R$ ${h.custo.toFixed(2)}/noite`, margin + 5, y);
        y += 5;
      });
    }

    if (c.locais.length) {
      checkPage(8);
      pdf.setFontSize(10); pdf.setFont(undefined, 'bold');
      pdf.text('Locais:', margin + 3, y); y += 5;
      pdf.setFont(undefined, 'normal'); pdf.setFontSize(9);
      c.locais.forEach(l => {
        checkPage(5);
        pdf.text(`  • ${l.data || '—'} ${l.hora || ''} — ${l.nome} (${l.cat})`, margin + 5, y);
        y += 5;
      });
    }
    y += 5;
  }

  checkPage(30);
  pdf.setFillColor(240, 244, 255);
  pdf.rect(margin, y, pageW - 2*margin, 9, 'F');
  pdf.setFontSize(13); pdf.setFont(undefined, 'bold'); pdf.setTextColor(118, 75, 162);
  pdf.text('💰 Orçamento', margin + 3, y + 6);
  y += 14; pdf.setTextColor(0, 0, 0);
  pdf.setFontSize(10); pdf.setFont(undefined, 'normal');

  const alim = parseFloat(document.getElementById('orc_alimentacao').value) || 0;
  const pas = parseFloat(document.getElementById('orc_passeios').value) || 0;
  const ext = parseFloat(document.getElementById('orc_extras').value) || 0;
  const dias = Math.max(1, parseInt(document.getElementById('dias').value) || 1);
  let cT = 0, cH = 0, cC = 0;
  estado.cidades.forEach(c => {
    cT += c.transporte.reduce((s,t)=>s+t.custo,0);
    cH += c.hotel.reduce((s,h)=>{
      if (h.checkin && h.checkout) {
        const d = Math.max(1, Math.ceil((new Date(h.checkout) - new Date(h.checkin))/86400000));
        return s + h.custo * d;
      }
      return s + h.custo;
    },0);
    if (c.conexao) cC += c.conexao.custo;
  });
  const tAlim = alim * dias;
  const total = cT + cH + cC + tAlim + pas + ext;

  const linhas = [
    ['Transporte', cT + cC],
    ['Hotel', cH],
    [`Alimentação (${dias} dias)`, tAlim],
    ['Passeios', pas],
    ['Extras', ext],
    ['TOTAL', total]
  ];
  linhas.forEach(([n, v], idx) => {
    checkPage(6);
    pdf.setFont(undefined, idx === linhas.length - 1 ? 'bold' : 'normal');
    pdf.text(`${n}: R$ ${v.toFixed(2)}`, margin + 5, y);
    y += 6;
  });

  pdf.save(`viagem-${destino.replace(/\s+/g, '-').toLowerCase()}.pdf`);
}

// ================= ATUALIZAR TUDO =================
function atualizarTudo() {
  gerarBagagem();
  render();
}

// ================= AUTO-DIAS =================
document.getElementById('dataIda').addEventListener('change', calcDias);
document.getElementById('dataVolta').addEventListener('change', calcDias);
function calcDias() {
  const ida = document.getElementById('dataIda').value;
  const volta = document.getElementById('dataVolta').value;
  if (ida && volta) {
    const d = Math.max(1, Math.ceil((new Date(volta) - new Date(ida)) / 86400000) + 1);
    document.getElementById('dias').value = d;
  }
}

// ================= INIT =================
carregarLocal();
render();
if (estado.bagagem.length === 0) gerarBagagem();
</script>
