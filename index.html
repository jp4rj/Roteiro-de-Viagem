<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viagem">
<title>Planejador de Viagem</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg-page: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --bg-card: #ffffff;
    --bg-card-alt: #fafbff;
    --bg-input: #ffffff;
    --bg-item: #f8f9fa;
    --bg-hover: #eef1ff;
    --text-primary: #333333;
    --text-secondary: #666666;
    --text-tertiary: #888888;
    --text-muted: #999999;
    --border: #dddddd;
    --border-light: #f0f0f0;
    --shadow: rgba(0, 0, 0, 0.15);
    --shadow-hover: rgba(0, 0, 0, 0.2);
  }

  body.dark {
    --bg-page: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    --bg-card: #1e1e2e;
    --bg-card-alt: #252538;
    --bg-input: #2a2a3e;
    --bg-item: #2a2a3e;
    --bg-hover: #33334a;
    --text-primary: #e4e4e7;
    --text-secondary: #a1a1aa;
    --text-tertiary: #71717a;
    --text-muted: #52525b;
    --border: #3f3f50;
    --border-light: #2f2f42;
    --shadow: rgba(0, 0, 0, 0.5);
    --shadow-hover: rgba(0, 0, 0, 0.7);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg-page);
    min-height: 100vh; padding: 20px; color: var(--text-primary);
    transition: background 0.3s, color 0.3s;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { color: white; text-align: center; margin-bottom: 20px; font-size: 2em; }
  .card {
    background: var(--bg-card); border-radius: 12px; padding: 20px;
    margin-bottom: 20px; box-shadow: 0 4px 20px var(--shadow);
    transition: background 0.3s;
  }
  .card h2 {
    color: #667eea; margin-bottom: 15px; font-size: 1.2em;
    border-bottom: 2px solid var(--border-light); padding-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
  label { display: block; font-size: 0.85em; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
  input, select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 0.95em; font-family: inherit;
    background: var(--bg-input); color: var(--text-primary);
    transition: background 0.3s, color 0.3s, border-color 0.3s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
  input:disabled, select:disabled { background: var(--bg-item); color: var(--text-tertiary); }
  textarea { resize: vertical; min-height: 38px; }
  button {
    background: #667eea; color: white; border: none; padding: 10px 20px;
    border-radius: 6px; cursor: pointer; font-size: 0.95em;
    font-weight: 600; transition: background 0.2s;
  }
  button:hover { background: #5568d3; }
  button.secondary { background: var(--bg-item); color: var(--text-primary); }
  button.secondary:hover { background: var(--bg-hover); }
  button.danger { background: #ff4757; padding: 6px 12px; font-size: 0.85em; color: white; }
  button.danger:hover { background: #ee3546; }
  button.small { padding: 6px 12px; font-size: 0.85em; }
  button.success { background: #10b981; color: white; }
  button.success:hover { background: #059669; }
  button.edit { background: #f59e0b; padding: 6px 12px; font-size: 0.85em; color: white; }
  button.edit:hover { background: #d97706; }
  .item-row {
    display: flex; gap: 8px; align-items: center; padding: 10px;
    background: var(--bg-item); border-radius: 6px; margin-bottom: 8px;
    color: var(--text-primary);
  }
  .item-row .item-info { flex: 1; }
  .item-row .item-title { font-weight: 600; }
  .item-row .item-detail { font-size: 0.85em; color: var(--text-secondary); }
  .item-row.editando { background: rgba(245, 158, 11, 0.12); border: 2px solid #f59e0b; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .badge {
    display: inline-block; background: #667eea; color: white;
    padding: 3px 8px; border-radius: 12px; font-size: 0.75em; margin-left: 8px;
  }
  .badge.cinza { background: var(--text-tertiary); }
  .bagagem-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .bagagem-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  .bagagem-item label { margin: 0; cursor: pointer; font-weight: normal; color: var(--text-primary); }
  .bagagem-item.done label { text-decoration: line-through; color: var(--text-muted); }
  .empty { color: var(--text-muted); font-style: italic; padding: 10px; text-align: center; }

  .cidade-card {
    background: var(--bg-card-alt); border: 2px solid var(--border-light);
    border-radius: 10px; padding: 15px; margin-bottom: 15px; position: relative;
    color: var(--text-primary);
    transition: background 0.3s;
  }
  .cidade-card.dragging { opacity: 0.4; }
  .cidade-card.drag-over { border-color: #667eea; background: var(--bg-hover); }
  .cidade-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--border);
    gap: 10px; flex-wrap: wrap;
  }
  .cidade-header h3 { color: #a78bfa; font-size: 1.1em; flex: 1; }
  .cidade-header small { color: var(--text-tertiary); font-weight: normal; font-size: 0.85em; }
  .drag-handle {
    cursor: grab; font-size: 1.4em; color: var(--text-tertiary); user-select: none; padding: 0 8px;
  }
  .drag-handle:active { cursor: grabbing; }
  .subtitulo {
    font-size: 0.9em; color: #667eea; font-weight: 700;
    margin: 15px 0 8px; display: flex; align-items: center; gap: 8px;
  }
  .subtitulo::before { content: ''; width: 4px; height: 16px; background: #667eea; border-radius: 2px; }
  .subtitulo.volta { color: #ef4444; }
  .subtitulo.volta::before { background: #ef4444; }

  .conexao-box {
    background: rgba(255, 183, 77, 0.1); border: 2px dashed #ffb74d;
    border-radius: 10px; padding: 12px; margin: 12px 0;
  }
  .conexao-box .conexao-titulo {
    color: #e65100; font-weight: 700; font-size: 0.95em;
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }
  body.dark .conexao-box .conexao-titulo { color: #ffb74d; }
  .conexao-box .conexao-hint {
    font-size: 0.78em; color: var(--text-muted); margin-top: 6px; font-style: italic;
  }

  .timeline { position: relative; padding-left: 30px; margin-top: 15px; }
  .timeline::before {
    content: ''; position: absolute; left: 8px; top: 0; bottom: 0;
    width: 3px; background: linear-gradient(180deg, #667eea, #764ba2); border-radius: 2px;
  }
  .timeline-dia { margin-bottom: 20px; position: relative; }
  .timeline-dia::before {
    content: ''; position: absolute; left: -26px; top: 6px;
    width: 14px; height: 14px; background: #667eea;
    border: 3px solid var(--bg-card); border-radius: 50%; box-shadow: 0 0 0 2px #667eea;
  }
  .timeline-dia h4 {
    color: #a78bfa; font-size: 1em; margin-bottom: 8px;
    background: var(--bg-hover); padding: 6px 10px; border-radius: 6px;
  }
  .timeline-evento {
    background: var(--bg-card); padding: 8px 12px; border-radius: 6px;
    margin-bottom: 6px; border-left: 3px solid #667eea;
    font-size: 0.9em; display: flex; gap: 8px; align-items: center;
    color: var(--text-primary);
  }
  .timeline-evento .hora { font-weight: 700; color: #667eea; min-width: 55px; }
  .timeline-evento.transporte { border-left-color: #f59e0b; }
  .timeline-evento.hotel { border-left-color: #10b981; }
  .timeline-evento.local { border-left-color: #667eea; }
  .timeline-evento.volta { border-left-color: #ef4444; }
  .timeline-evento.conexao { border-left-color: #e65100; }

  .orcamento-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; margin-top: 12px;
  }
  .orcamento-item {
    background: var(--bg-item); padding: 12px; border-radius: 8px; border-left: 4px solid #667eea;
  }
  .orcamento-item .label { font-size: 0.8em; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; }
  .orcamento-item .valor { font-size: 1.3em; font-weight: 700; color: var(--text-primary); margin-top: 4px; }
  .orcamento-item.transporte { border-left-color: #f59e0b; }
  .orcamento-item.hotel { border-left-color: #10b981; }
  .orcamento-item.alimentacao { border-left-color: #ef4444; }
  .orcamento-item.passeios { border-left-color: #8b5cf6; }
  .orcamento-item.total { border-left-color: #667eea; background: var(--bg-hover); }

  .fab {
    position: fixed; bottom: 20px; right: 20px;
    width: 60px; height: 60px; border-radius: 50%;
    background: #ef4444; color: white; font-size: 1.5em;
    box-shadow: 0 4px 15px var(--shadow); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: none;
  }
  .fab:hover { background: #dc2626; transform: scale(1.05); }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
    padding-right: 70px;
  }
  .topbar h1 { color: white; margin: 0; font-size: 1.8em; }
  .topbar-acoes { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn-tema {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--bg-card);
    color: var(--text-primary);
    box-shadow: 0 4px 15px var(--shadow);
    font-size: 1.3em;
    z-index: 1500;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    transition: transform 0.2s, background 0.3s;
    padding: 0;
  }
  .btn-tema:hover { transform: scale(1.1); background: var(--bg-card-alt); }
  .btn-tema:active { transform: scale(0.95); }

  .menu-tema {
    position: fixed;
    top: 78px;
    right: 20px;
    background: var(--bg-card);
    border-radius: 10px;
    box-shadow: 0 8px 25px var(--shadow-hover);
    padding: 8px;
    z-index: 1499;
    display: none;
    min-width: 160px;
    border: 1px solid var(--border-light);
  }
  .menu-tema.ativo { display: block; }
  .menu-tema button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    background: transparent;
    color: var(--text-primary);
    border-radius: 6px;
    font-weight: 500;
    font-size: 0.9em;
    transition: background 0.15s;
    border: none;
  }
  .menu-tema button:hover { background: var(--bg-hover); }
  .menu-tema button.ativo {
    background: #667eea;
    color: white;
  }

  .modo-view .form-add,
  .modo-view .btn-add,
  .modo-view .btn-del,
  .modo-view .btn-edit { display: none !important; }

  .aviso-modo {
    background: rgba(16, 185, 129, 0.15); border-left: 4px solid #10b981;
    padding: 10px 15px; border-radius: 6px; margin-bottom: 15px;
    font-size: 0.9em; color: #10b981; display: flex;
    align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .aviso-modo.edicao {
    background: rgba(245, 158, 11, 0.15); border-left-color: #f59e0b; color: #f59e0b;
  }

  .viagem-card {
    background: var(--bg-card); border-radius: 12px; overflow: hidden;
    margin-bottom: 16px; box-shadow: 0 4px 15px var(--shadow);
    transition: transform 0.15s, box-shadow 0.15s, background 0.3s;
  }
  .viagem-card:hover {
    transform: translateY(-3px); box-shadow: 0 8px 25px var(--shadow-hover);
  }
  .viagem-card .capa {
    width: 100%; height: 160px; background-size: cover; background-position: center;
    background-color: #e0e6ff;
    background-image: linear-gradient(135deg, #667eea, #764ba2);
    position: relative; display: flex; align-items: flex-end; overflow: hidden;
  }
  .viagem-card .capa::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.65) 100%);
    pointer-events: none;
  }
  .viagem-card .capa .titulo-capa {
    position: relative; z-index: 1; color: white; padding: 12px 16px;
    font-size: 1.15em; font-weight: 700;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    display: flex; align-items: center; gap: 6px; width: 100%;
  }
  .viagem-card .capa .credito-foto {
    position: absolute; top: 8px; right: 10px; z-index: 1;
    font-size: 0.65em; color: rgba(255,255,255,0.9);
    background: rgba(0,0,0,0.45); padding: 2px 6px; border-radius: 4px;
  }
  .viagem-card .capa.vazia {
    align-items: flex-end;
    background: linear-gradient(135deg, var(--g1, #667eea), var(--g2, #764ba2));
  }
  .viagem-card .capa.vazia::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
  }
  .viagem-card .capa .avatar-cidade {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 2px solid rgba(255,255,255,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3em; font-weight: 800; color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4); z-index: 1;
  }
  .viagem-card .corpo { padding: 16px; }
  .viagem-card .meta {
    font-size: 0.88em; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.6;
  }
  .viagem-card .botoes { display: flex; gap: 6px; flex-wrap: wrap; }
  .viagem-card.vazia {
    padding: 40px; text-align: center; color: var(--text-muted);
  }
  .viagem-card.vazia:hover { transform: none; }

  .banner-offline {
    position: fixed; top: 0; left: 0; right: 0;
    background: #f59e0b; color: white; text-align: center;
    padding: 8px; font-size: 0.9em; font-weight: 600;
    z-index: 2000; display: none;
  }
  .banner-offline.ativo { display: block; }

  .backup-area {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .backup-area input[type="file"] {
    padding: 8px; border: 2px dashed var(--border); border-radius: 6px;
    font-size: 0.85em; cursor: pointer; background: var(--bg-item);
    color: var(--text-primary);
  }

  @media (max-width: 600px) {
    .item-row { flex-wrap: wrap; }
    h1 { font-size: 1.5em; }
    .timeline { padding-left: 24px; }
    .viagem-card .capa { height: 130px; }
    .viagem-card .capa .titulo-capa { font-size: 1em; }
    .topbar { padding-right: 70px; }
    .topbar h1 { font-size: 1.3em; }
    .grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="bannerOffline" class="banner-offline">📡 Você está offline — modo cache ativo</div>

<button class="btn-tema" id="btnTema" onclick="toggleMenuTema()" title="Tema">☀️</button>
<div class="menu-tema" id="menuTema">
  <button data-tema="claro" onclick="definirTema('claro')">☀️ Claro</button>
  <button data-tema="escuro" onclick="definirTema('escuro')">🌙 Escuro</button>
  <button data-tema="auto" onclick="definirTema('auto')">🔄 Automático</button>
</div>

<!-- ==================== TELA: LISTA DE VIAGENS ==================== -->
<div id="telaLista" class="container">
  <div class="topbar">
    <h1>✈️ Minhas Viagens</h1>
    <div class="topbar-acoes">
      <button class="secondary" onclick="exportarBackup()" title="Baixar backup de todas as viagens">💾 Backup</button>
      <button class="secondary" onclick="document.getElementById('inputRestaurar').click()" title="Restaurar de um arquivo JSON">📂 Restaurar</button>
      <input type="file" id="inputRestaurar" accept=".json,application/json" style="display:none" onchange="restaurarBackup(event)">
      <button onclick="novaViagem()">+ Nova Viagem</button>
    </div>
  </div>
  <div id="listaViagens"></div>
</div>

<!-- ==================== TELA: EDITOR ==================== -->
<div id="telaEditor" class="container" style="display:none;">
  <div class="topbar">
    <button class="secondary" onclick="voltarParaLista()">← Minhas Viagens</button>
    <h1 id="tituloEditor" style="font-size:1.4em;flex:1;text-align:center;">Viagem</h1>
    <div class="topbar-acoes">
      <button id="btnAlternarModo" class="edit" onclick="alternarModo()">✏️ Editar</button>
      <button id="btnSalvar" class="secondary" onclick="salvarViagemAtual()">💾 Salvar</button>
    </div>
  </div>

  <div id="avisoModo" class="aviso-modo"></div>

  <div class="card">
    <h2>🎯 Configuração da Viagem</h2>
    <div class="grid">
      <div><label>Nome / Destino geral</label><input id="destino" placeholder="Ex: Europa 2026"></div>
      <div><label>Data de ida</label><input id="dataIda" type="date"></div>
      <div><label>Data de volta</label><input id="dataVolta" type="date"></div>
      <div><label>Quantidade de dias</label><input id="dias" type="number" min="1" value="3"></div>
      <div>
        <label>Tipo de viagem</label>
        <select id="tipoViagem">
          <option value="lazer">Lazer</option><option value="negocios">Negócios</option>
          <option value="aventura">Aventura</option><option value="praia">Praia</option>
          <option value="cultural">Cultural</option><option value="mochilao">Mochilão</option>
        </select>
      </div>
      <div>
        <label>Clima esperado</label>
        <select id="clima">
          <option value="quente">Quente</option><option value="frio">Frio</option>
          <option value="ameno">Ameno</option><option value="chuva">Chuvoso</option>
        </select>
      </div>
    </div>
    <div class="actions btn-add">
      <button onclick="atualizarTudo()">🔄 Atualizar / Gerar Bagagem</button>
    </div>
  </div>

  <div class="card">
    <h2>🏙️ Cidades da Viagem <span class="badge" id="badgeCidades">0</span></h2>
    <p style="font-size:0.85em;color:var(--text-tertiary);margin-bottom:10px;">💡 Arraste o ícone <strong>⋮⋮</strong> para reordenar. A 1ª cidade com foto vira capa do card na lista.</p>
    <div class="grid form-add">
      <div><label>Nome da cidade</label><input id="cidade_nome" placeholder="Ex: Lisboa"></div>
      <div><label>Chegada</label><input id="cidade_chegada" type="date"></div>
      <div><label>Saída</label><input id="cidade_saida" type="date"></div>
    </div>
    <div class="actions btn-add"><button onclick="addCidade()">+ Adicionar Cidade</button></div>
    <div id="listaCidades" style="margin-top:15px;"></div>
  </div>

  <div class="card">
    <h2>📅 Roteiro por Dia</h2>
    <div id="timeline"></div>
  </div>

  <div class="card">
    <h2>💰 Orçamento Detalhado</h2>
    <div class="grid">
      <div><label>Alimentação (R$/dia)</label><input id="orc_alimentacao" type="number" value="150" onchange="render()"></div>
      <div><label>Passeios (R$ total)</label><input id="orc_passeios" type="number" value="500" onchange="render()"></div>
      <div><label>Extras</label><input id="orc_extras" type="number" value="300" onchange="render()"></div>
    </div>
    <div id="orcamento" class="orcamento-grid"></div>
  </div>

  <div class="card">
    <h2>🎒 Bagagem <span class="badge" id="badgeBagagem">0 itens</span></h2>
    <div class="actions btn-add" style="margin-bottom:12px;">
      <button onclick="gerarBagagem()">🔄 Regenerar</button>
      <button class="secondary" onclick="limparBagagem()">🗑️ Limpar</button>
    </div>
    <div id="listaBagagem"></div>
  </div>
</div>

<button class="fab" id="fabPDF" onclick="exportarPDF()" title="Exportar PDF" style="display:none;">📄</button>

<script>
// ===================== ESTADO GLOBAL =====================
let store = { viagens: {}, atual: null };
let estado = null;
let modoEdicao = false;

// ===================== TEMA =====================
const TEMA_KEY = 'temaViagem';

function getTemaPreferido() {
  return localStorage.getItem(TEMA_KEY) || 'auto';
}

function temaEfetivo(tema) {
  if (tema === 'escuro') return 'escuro';
  if (tema === 'claro') return 'claro';
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
}

function aplicarTema() {
  const tema = getTemaPreferido();
  const efetivo = temaEfetivo(tema);
  document.body.classList.toggle('dark', efetivo === 'escuro');

  const btn = document.getElementById('btnTema');
  if (btn) {
    btn.textContent = efetivo === 'escuro' ? '🌙' : '☀️';
  }

  document.querySelectorAll('.menu-tema button').forEach(b => {
    b.classList.toggle('ativo', b.dataset.tema === tema);
  });

  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) {
    metaTheme.setAttribute('content', efetivo === 'escuro' ? '#1a1a2e' : '#667eea');
  }
}

  localStorage.setItem(TEMA_KEY, tema);
  aplicarTema();
  fecharMenuTema();
}

function toggleMenuTema() {

// ===================== BACKUP / RESTAURAR =====================
function exportarBackup() {
  const dados = {
    versao: 1,
    app: 'planejador-viagem',
    exportadoEm: new Date().toISOString(),
    viagens: store.viagens
  };
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const dataStr = new Date().toISOString().slice(0, 10);
  a.download = `backup-viagens-${dataStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function restaurarBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const dados = JSON.parse(e.target.result);
      if (!dados.viagens || typeof dados.viagens !== 'object') {
        return alert('❌ Arquivo inválido. Não é um backup do planejador.');
      }
      const nViagens = Object.keys(dados.viagens).length;
      const escolha = confirm(
        `📂 Backup encontrado com ${nViagens} viagem(ns).\n\n` +
        `OK = MESCLAR (mantém as viagens atuais + adiciona as do backup)\n` +
        `Cancelar = SUBSTITUIR (apaga tudo e usa só o backup)`
      );
      if (escolha) {
        Object.entries(dados.viagens).forEach(([id, v]) => {
          if (store.viagens[id]) {
            const novoId = gerarId();
            v.id = novoId;
            store.viagens[novoId] = v;
          } else {
            store.viagens[id] = v;
          }
        });
      } else {
        if (!confirm('⚠️ Tem certeza? Todas as viagens atuais serão apagadas.')) return;
        store.viagens = dados.viagens;
        store.atual = null;
      }
      persistirStore();
      renderLista();
      alert(`✅ ${nViagens} viagem(ns) restaurada(s)!`);
    } catch (err) {
      alert('❌ Erro ao ler o arquivo: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===================== FOTOS (Wikipedia) =====================
const fotoCache = new Map();
const FOTO_CACHE_KEY = 'fotosCidades_v2';

function carregarFotoCache() {
  try {
    const raw = sessionStorage.getItem(FOTO_CACHE_KEY);
    if (raw) {
      const obj = JSON.parse(raw);
      Object.entries(obj).forEach(([k, v]) => fotoCache.set(k, v));
    }
  } catch(e) {}
}
function salvarFotoCache() {
  try {
    const obj = {};
    fotoCache.forEach((v, k) => obj[k] = v);
    sessionStorage.setItem(FOTO_CACHE_KEY, JSON.stringify(obj));
  } catch(e) {}
}
async function buscarFotoCidade(nomeCidade) {
  const chave = nomeCidade.trim().toLowerCase();
  if (!chave) return null;
  if (fotoCache.has(chave)) return fotoCache.get(chave);
  for (const lang of ['pt', 'en']) {
    try {
      const url = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(nomeCidade.trim())}`;
      const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!resp.ok) continue;
      const data = await resp.json();
      const foto = data.thumbnail?.source || data.originalimage?.source || null;
      if (foto) {
        const resultado = { url: foto, titulo: data.title || nomeCidade };
        fotoCache.set(chave, resultado);
        salvarFotoCache();
        return resultado;
      }
    } catch(e) {}
  }
  fotoCache.set(chave, null);
  salvarFotoCache();
  return null;
}

const GRADIENTES = [
  ['#667eea', '#764ba2'], ['#f093fb', '#f5576c'], ['#4facfe', '#00f2fe'],
  ['#fa709a', '#fee140'], ['#30cfd0', '#330867'], ['#a8edea', '#fed6e3'],
  ['#ff9a9e', '#fecfef'], ['#ff6a00', '#ee0979'], ['#43e97b', '#38f9d7'],
  ['#5ee7df', '#b490ca'], ['#f6d365', '#fda085'], ['#84fab0', '#8fd3f4']
];

function hashNome(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h = h & h;
  }
  return Math.abs(h);
}

function iniciais(nome) {
  const partes = nome.trim().split(/\s+/).filter(p => p.length > 2);
  if (partes.length === 0) return nome.slice(0, 2).toUpperCase();
  if (partes.length === 1) return partes[0].slice(0, 2).toUpperCase();
  return (partes[0][0] + partes[1][0]).toUpperCase();
}

async function aplicarFotoCapa(el, listaCidades, nomeViagem) {
  if (!el) return;
  const titulo = el.querySelector('.titulo-capa');
  let res = null;
  let cidadeUsada = null;
  for (const cidade of listaCidades) {
    const nome = (cidade || '').trim();
    if (!nome) continue;
    res = await buscarFotoCidade(nome);
    if (res && res.url) { cidadeUsada = nome; break; }
  }
  if (res && res.url) {
    el.style.backgroundImage = `url('${res.url}')`;
    el.classList.remove('vazia');
    el.innerHTML = '';
    if (titulo) el.appendChild(titulo);
    const credito = document.createElement('span');
    credito.className = 'credito-foto';
    credito.textContent = '📷 ' + cidadeUsada;
    el.appendChild(credito);
  } else {
    el.classList.add('vazia');
    el.innerHTML = '';
    const referencia = (listaCidades[0] || nomeViagem || '?').trim();
    const idx = hashNome(referencia.toLowerCase()) % GRADIENTES.length;
    el.style.setProperty('--g1', GRADIENTES[idx][0]);
    el.style.setProperty('--g2', GRADIENTES[idx][1]);
    el.style.backgroundImage = '';
    const avatar = document.createElement('div');
    avatar.className = 'avatar-cidade';
    avatar.textContent = iniciais(referencia);
    el.appendChild(avatar);
    if (titulo) el.appendChild(titulo);
  }
}

// ===================== FORMATAÇÃO DE DATAS =====================
function formatarData(iso) {
  if (!iso) return '—';
  if (typeof iso !== 'string') return String(iso);
  if (iso.includes('/')) return iso;
  const partes = iso.split('-');
  if (partes.length !== 3) return iso;
  const [y, m, d] = partes;
  return `${d}/${m}/${y}`;
}
function formatarDataHora(data, hora) {
  if (!data && !hora) return '—';
  const dataFmt = data ? formatarData(data) : '';
  const horaFmt = hora || '';
  if (dataFmt && horaFmt) return `${dataFmt} ${horaFmt}`;
  return dataFmt || horaFmt || '—';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function mostrarLista() {

  renderLista();

function renderLista() {
  const box = document.getElementById('listaViagens');
  const ids = Object.keys(store.viagens);

  if (ids.length === 0) {
    box.innerHTML = `
      <div class="viagem-card vazia">
        <p style="font-size:1.1em;margin-bottom:15px;">Nenhuma viagem cadastrada ainda</p>
        <button onclick="novaViagem()">+ Criar minha primeira viagem</button>
      </div>`;
    return;
  }

  ids.sort((a, b) => (store.viagens[b].criadaEm || '').localeCompare(store.viagens[a].criadaEm || ''));

  box.innerHTML = ids.map(id => {
    const v = store.viagens[id];
    const d = v.dados || {};
    const nCidades = (d.cidades || []).length;
    const nLocais = (d.cidades || []).reduce((s, c) => s + (c.locais?.length || 0), 0);
    const periodo = (d.dataIda && d.dataVolta)
      ? `${formatarData(d.dataIda)} → ${formatarData(d.dataVolta)}` : 'Datas não definidas';

    return `
      <div class="viagem-card">
        <div class="capa" id="capa_viagem_${id}">
          <div class="titulo-capa">✈️ ${escapeHtml(v.nome || 'Viagem sem nome')}</div>
        </div>
        <div class="corpo">
          <div class="meta">
            📅 ${periodo}<br>
            🏙️ ${nCidades} cidade(s) · 📍 ${nLocais} local(is)
          </div>
          <div class="botoes">
            <button onclick="abrirViagem('${id}')">Abrir</button>
            <button class="secondary" onclick="duplicarViagem('${id}')">📋 Duplicar</button>
            <button class="danger" onclick="excluirViagem('${id}')">Excluir</button>
          </div>
        </div>
      </div>`;
  }).join('');

  ids.forEach(id => {
    const v = store.viagens[id];
    const d = v.dados || {};
    const nomesCidades = (d.cidades || [])
      .map(c => (c.nome || '').trim())
      .filter(Boolean);
    if (nomesCidades.length === 0) {
      const extra = (d.destino || v.nome || '').trim();
      if (extra) nomesCidades.push(extra);
    }
    const el = document.getElementById(`capa_viagem_${id}`);
    if (el && nomesCidades.length > 0) {
      aplicarFotoCapa(el, nomesCidades, v.nome || '');
    } else if (el) {
      el.classList.add('vazia');
    }
  });
}

function novaViagem() {

  const id = gerarId();
  store.viagens[id] = {
    id,
    nome: nome.trim() || 'Viagem sem nome',
    criadaEm: new Date().toISOString(),
    dados: {
      destino: nome.trim() || '',
      dataIda: '', dataVolta: '', dias: 3,
      tipoViagem: 'lazer', clima: 'ameno',
      bagagem: [], cidades: [],
      orcamento: { alimentacao: 150, passeios: 500, extras: 300 }
    }
  };
  persistirStore();
  abrirViagem(id, true);
}

function abrirViagem(id, forcarEdicao) {
  if (!store.viagens[id]) return alert('Viagem não encontrada');
  store.atual = id;
  persistirStore();
  estado = JSON.parse(JSON.stringify(store.viagens[id].dados));
  estado.cidades = (estado.cidades || []).map(c => {
    const nova = {
      nome: c.nome || '',
      chegada: c.chegada || '',
      saida: c.saida || '',
      transporte: (c.transporte || []).map(t => normalizarTransporte(t)),
      conexao: c.conexao ? normalizarTransporte(c.conexao) : null,
      hotel: c.hotel || [],
      locais: c.locais || [],
      volta: c.volta ? normalizarTransporte(c.volta) : null,
      _rascunhoChegada: null,
      _rascunhoConexao: null,
      _rascunhoVolta: null,
      _editando: null
    };
    return nova;
  });
  estado._editando = null;
  modoEdicao = !!forcarEdicao;
  carregarEstadoNoForm();
  document.getElementById('telaLista').style.display = 'none';
  document.getElementById('telaEditor').style.display = 'block';
  document.getElementById('fabPDF').style.display = 'flex';
  document.getElementById('tituloEditor').textContent = store.viagens[id].nome;
  aplicarModo();
  render();
  if (!estado.bagagem || estado.bagagem.length === 0) {
    gerarBagagem();
    if (!modoEdicao) salvarViagemAtual(true);
  }
}

// Migra dados antigos: se tinha `data: "12/05 14:00"` (texto livre), tenta separar
// Se já está no formato novo (data + hora separados), mantém
function normalizarTransporte(obj) {
  const novo = {
    tipo: obj.tipo || 'Avião',
    empresa: obj.empresa || '',
    data: obj.data || '',
    hora: obj.hora || '',
    custo: parseFloat(obj.custo) || 0,
    voucher: obj.voucher || '',
    obs: obj.obs || ''
  };
  // Se não tem `hora` separada e `data` contém espaço, tenta separar (compatibilidade)
  if (!novo.hora && novo.data && /\s/.test(novo.data.trim())) {
    const partes = novo.data.trim().split(/\s+/);
    if (partes.length === 2) {
      novo.data = partes[0];
      novo.hora = partes[1];
    }
  }
  return novo;
}

function duplicarViagem(id) {
  const orig = store.viagens[id];
  if (!orig) return;
  const novoId = gerarId();
  const copia = JSON.parse(JSON.stringify(orig));
  copia.id = novoId;
  copia.nome = orig.nome + ' (cópia)';
  copia.criadaEm = new Date().toISOString();
  if (copia.dados && copia.dados.cidades) {
    copia.dados.cidades.forEach(c => {
      c._rascunhoChegada = null;
      c._rascunhoConexao = null;
      c._rascunhoVolta = null;
      c._editando = null;
    });
  }
  store.viagens[novoId] = copia;
  persistirStore();
  renderLista();
}
function excluirViagem(id) {
  if (!confirm('Excluir esta viagem permanentemente?')) return;
  delete store.viagens[id];
  if (store.atual === id) store.atual = null;
  persistirStore();
  renderLista();
}
function voltarParaLista() {
  if (modoEdicao) salvarViagemAtual(true);
  mostrarLista();
}

function salvarViagemAtual(silencioso) {
  if (!store.atual || !estado) return;
  estado.destino = document.getElementById('destino').value;
  estado.dataIda = document.getElementById('dataIda').value;
  estado.dataVolta = document.getElementById('dataVolta').value;
  estado.dias = parseInt(document.getElementById('dias').value) || 3;
  estado.tipoViagem = document.getElementById('tipoViagem').value;
  estado.clima = document.getElementById('clima').value;
  estado.orcamento.alimentacao = parseFloat(document.getElementById('orc_alimentacao').value) || 0;
  estado.orcamento.passeios = parseFloat(document.getElementById('orc_passeios').value) || 0;
  estado.orcamento.extras = parseFloat(document.getElementById('orc_extras').value) || 0;

  const limpo = JSON.parse(JSON.stringify(estado));
  (limpo.cidades || []).forEach(c => {
    delete c._rascunhoChegada;
    delete c._rascunhoConexao;
    delete c._rascunhoVolta;
    delete c._editando;
  });
  delete limpo._editando;

  store.viagens[store.atual].dados = limpo;
  if (estado.destino) {
    store.viagens[store.atual].nome = estado.destino;
    document.getElementById('tituloEditor').textContent = estado.destino;
  }
  persistirStore();
  if (!silencioso) alert('✅ Viagem salva!');
}

function addChegada(cIdx) {

  const data = document.getElementById(`chegada_data_${cIdx}`).value;

// ===================== EDIÇÃO INLINE =====================
function iniciarEdicao(cIdx, tipo, idx) {
  salvarRascunhos();
  estado.cidades[cIdx]._editando = { tipo, idx };
  render();
  setTimeout(() => {
    const el = document.getElementById(`edicao_${tipo}_${cIdx}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 50);
}
function cancelarEdicao(cIdx) {
  estado.cidades[cIdx]._editando = null;
  render();
}
function salvarEdicao(cIdx) {
  const c = estado.cidades[cIdx];
  const ed = c._editando;
  if (!ed) return;
  const { tipo, idx } = ed;

  if (tipo === 'chegada') {
    const t = c.transporte[idx];
    t.tipo = document.getElementById(`ed_chegada_tipo_${cIdx}`).value;
    t.empresa = document.getElementById(`ed_chegada_empresa_${cIdx}`).value.trim();
    t.data = document.getElementById(`ed_chegada_data_${cIdx}`).value;
    t.hora = document.getElementById(`ed_chegada_hora_${cIdx}`).value;
    t.custo = parseFloat(document.getElementById(`ed_chegada_custo_${cIdx}`).value) || 0;
    t.voucher = document.getElementById(`ed_chegada_voucher_${cIdx}`).value.trim();
  } else if (tipo === 'hotel') {
    const h = c.hotel[idx];
    h.nome = document.getElementById(`ed_hotel_nome_${cIdx}`).value.trim();
    h.end = document.getElementById(`ed_hotel_end_${cIdx}`).value.trim();
    h.checkin = document.getElementById(`ed_hotel_in_${cIdx}`).value;
    h.checkout = document.getElementById(`ed_hotel_out_${cIdx}`).value;
    h.custo = parseFloat(document.getElementById(`ed_hotel_custo_${cIdx}`).value) || 0;
  } else if (tipo === 'local') {
    const l = c.locais[idx];
    l.nome = document.getElementById(`ed_local_nome_${cIdx}`).value.trim();
    l.data = document.getElementById(`ed_local_data_${cIdx}`).value;
    l.hora = document.getElementById(`ed_local_hora_${cIdx}`).value;
    l.cat = document.getElementById(`ed_local_cat_${cIdx}`).value;
  } else if (tipo === 'conexao') {
    c.conexao = {
      tipo: document.getElementById(`ed_conexao_tipo_${cIdx}`).value,
      empresa: document.getElementById(`ed_conexao_empresa_${cIdx}`).value.trim(),
      data: document.getElementById(`ed_conexao_data_${cIdx}`).value,
      hora: document.getElementById(`ed_conexao_hora_${cIdx}`).value,
      custo: parseFloat(document.getElementById(`ed_conexao_custo_${cIdx}`).value) || 0,
      voucher: document.getElementById(`ed_conexao_voucher_${cIdx}`).value.trim(),
      obs: document.getElementById(`ed_conexao_obs_${cIdx}`).value.trim()
    };
  } else if (tipo === 'volta') {
    c.volta = {
      tipo: document.getElementById(`ed_volta_tipo_${cIdx}`).value,
      empresa: document.getElementById(`ed_volta_empresa_${cIdx}`).value.trim(),
      data: document.getElementById(`ed_volta_data_${cIdx}`).value,
      hora: document.getElementById(`ed_volta_hora_${cIdx}`).value,
      custo: parseFloat(document.getElementById(`ed_volta_custo_${cIdx}`).value) || 0,
      voucher: document.getElementById(`ed_volta_voucher_${cIdx}`).value.trim(),
      obs: ''
    };
  } else if (tipo === 'cidade') {
    c.nome = document.getElementById(`ed_cidade_nome_${cIdx}`).value.trim();
    c.chegada = document.getElementById(`ed_cidade_chegada_${cIdx}`).value;
    c.saida = document.getElementById(`ed_cidade_saida_${cIdx}`).value;
  }

  c._editando = null;
  render();
}

// ===================== BAGAGEM =====================
function gerarBagagem() {
  const tipo = document.getElementById('tipoViagem').value;
  const clima = document.getElementById('clima').value;
  const dias = Math.max(1, parseInt(document.getElementById('dias').value) || 1);
  const base = ['Escova de dentes', 'Pasta de dente', 'Desodorante', 'Shampoo',
    'Documentos (RG/Passaporte)', 'Celular + carregador', 'Carteira', 'Remédios pessoais'];
  const roupaBase = dias <= 2 ? 2 : Math.min(dias, 7);
  let roupas = ['Cuecas/calcinhas x' + (roupaBase+1), 'Meias x' + (roupaBase+1), 'Camisetas x' + (roupaBase+1)];
  let extras = [];
  let calcados = ['Tênis confortável'];

  if (clima === 'quente') {
    roupas.push('Bermudas/shorts x' + roupaBase);
    extras.push('Protetor solar', 'Óculos de sol', 'Boné/chapéu', 'Repelente');
    calcados.push('Chinelo/sandália');
  } else if (clima === 'frio') {
    roupas.push('Calças x' + roupaBase, 'Casacos/blusas x' + Math.min(dias, 3), 'Suéteres');
    extras.push('Luvas', 'Cachecol', 'Gorro', 'Hidratante labial');
    calcados.push('Botas/calçado fechado');
  } else if (clima === 'chuva') {
    extras.push('Guarda-chuva', 'Capa de chuva', 'Sapato impermeável');
    roupas.push('Calças x' + roupaBase, 'Jaqueta impermeável');
  } else {
    roupas.push('Calças x' + roupaBase, 'Jaqueta leve');
  }

  if (tipo === 'negocios') {
    roupas.push('Traje social/terno', 'Camisa social x' + Math.min(dias, 3));
    extras.push('Notebook + carregador', 'Cartões de visita', 'Pasta/porta-documentos');
    calcados.push('Sapato social');
  } else if (tipo === 'praia') {
    extras.push('Maiô/sunga', 'Toalha de praia', 'Protetor solar FPS 50+', 'Bolsa térmica');
    calcados = ['Chinelo', 'Sandália'];
  } else if (tipo === 'aventura') {
    extras.push('Mochila pequena', "Garrafa d'água", 'Lanterna', 'Canivete', 'Kit primeiros socorros', 'Repelente');
    calcados.push('Bota de trilha');
  } else if (tipo === 'mochilao') {
    extras.push('Mochila cargueira', 'Cadeado para mochila', 'Saco de dormir leve', 'Toalha rápida', 'Adaptador de tomada');
    calcados.push('Sandália');
  } else if (tipo === 'cultural') {
    extras.push('Guia/caderno', 'Câmera fotográfica', 'Roupas confortáveis para caminhar');
  } else {
    extras.push('Roupas casuais extras', 'Livro/entretenimento');
  }
  extras.push('Seguro viagem', 'Reservas impressas');

  estado.bagagem = [
    ...base.map(t => ({ item: t, cat: 'Essenciais', done: false })),
    ...roupas.map(t => ({ item: t, cat: 'Roupas', done: false })),
    ...calcados.map(t => ({ item: t, cat: 'Calçados', done: false })),
    ...extras.map(t => ({ item: t, cat: 'Extras', done: false }))
  ];
  render();
}
function limparBagagem() { if (confirm('Limpar toda a bagagem?')) { estado.bagagem = []; render(); } }
function toggleBagagem(i) {
  if (!modoEdicao) return;
  estado.bagagem[i].done = !estado.bagagem[i].done;
  render();
}

  salvarRascunhos();

  }

function renderTimeline() {
  const box = document.getElementById('timeline');
  const eventos = [];
  estado.cidades.forEach((c, i) => {
    if (c.chegada) eventos.push({
      data: c.chegada, hora: '', tipo: 'transporte',
      titulo: `Chegada em ${c.nome}`, sub: ''
    });
    c.transporte.forEach(t => {
      if (t.data || t.hora) {
        eventos.push({ data: t.data || '', hora: t.hora || '', tipo: 'transporte',
          titulo: `🛫 Chegada — ${t.tipo} ${t.empresa || ''}`, sub: `Em ${c.nome}` });
      }
    });
    if (c.conexao && (c.conexao.data || c.conexao.hora)) {
      eventos.push({ data: c.conexao.data || '', hora: c.conexao.hora || '', tipo: 'conexao',
        titulo: `🔗 ${c.conexao.tipo} ${c.conexao.empresa || ''}`,
        sub: `${estado.cidades[i-1]?.nome || '?'} → ${c.nome}` });
    }
    c.hotel.forEach(h => {
      if (h.checkin) eventos.push({ data: h.checkin, hora: '', tipo: 'hotel',
        titulo: `Check-in ${h.nome}`, sub: c.nome });
    });
    c.locais.forEach(l => {
      if (l.data || l.hora) eventos.push({ data: l.data || '', hora: l.hora || '', tipo: 'local',
        titulo: l.nome, sub: `${c.nome} • ${l.cat}` });
    });
    if (c.volta && (c.volta.data || c.volta.hora)) {
      eventos.push({
        data: c.volta.data || '', hora: c.volta.hora || '', tipo: 'volta',
        titulo: `🛬 Volta para casa — ${c.volta.tipo} ${c.volta.empresa || ''}`,
        sub: `De ${c.nome}`
      });
    }
  });
  if (eventos.length === 0) {
    box.innerHTML = '<div class="empty">Adicione datas aos locais/transportes</div>';
    return;
  }
  const chaveOrdenacao = (e) => {
    const d = e.data || '';
    const h = e.hora || '00:00';
    if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d + ' ' + h;
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(d)) {
      const [dd, mm, yyyy] = d.split('/');
      return `${yyyy}-${mm}-${dd} ${h}`;
    }
    return d + ' ' + h;
  };
  eventos.sort((a, b) => chaveOrdenacao(a).localeCompare(chaveOrdenacao(b)));
  const porDia = {};
  eventos.forEach(e => {
    const chave = e.data || 'sem-data';
    if (!porDia[chave]) porDia[chave] = [];
    porDia[chave].push(e);
  });
  box.innerHTML = '<div class="timeline">' + Object.entries(porDia).map(([data, evs]) => {
    let dt = null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(data)) {
      dt = new Date(data + 'T00:00:00');
    } else if (/^\d{2}\/\d{2}\/\d{4}$/.test(data)) {
      const [d, m, y] = data.split('/');
      dt = new Date(`${y}-${m}-${d}T00:00:00`);
    }
    const diaSemana = dt ? dt.toLocaleDateString('pt-BR', { weekday: 'long' }) : '';
    const dataFmt = data === 'sem-data' ? 'Sem data' : formatarData(data);
    return `
      <div class="timeline-dia">
        <h4>📅 ${dataFmt}${diaSemana ? ' (' + diaSemana + ')' : ''}</h4>
        ${evs.map(e => `
          <div class="timeline-evento ${e.tipo}">
            <span class="hora">${e.hora || '—'}</span>
            <strong>${e.titulo}</strong>
            ${e.sub ? `<span style="color:var(--text-tertiary);font-size:0.85em;">· ${e.sub}</span>` : ''}
          </div>
        `).join('')}
      </div>`;
  }).join('') + '</div>';
}

function renderBagagem() {
  const lb = document.getElementById('listaBagagem');
  document.getElementById('badgeBagagem').textContent =
    `${estado.bagagem.filter(b => !b.done).length} / ${estado.bagagem.length} itens`;
  if (estado.bagagem.length === 0) {
    lb.innerHTML = '<div class="empty">Clique em "Regenerar"</div>';
    return;
  }
  const cats = {};
  estado.bagagem.forEach((b, i) => { if (!cats[b.cat]) cats[b.cat] = []; cats[b.cat].push({ ...b, idx: i }); });
  lb.innerHTML = Object.entries(cats).map(([cat, itens]) => `
    <div style="margin-bottom:12px;">
      <strong style="color:#667eea;font-size:0.9em;">${cat}</strong>
      ${itens.map(it => `
        <div class="bagagem-item ${it.done ? 'done' : ''}">
          <input type="checkbox" ${it.done ? 'checked' : ''} ${modoEdicao ? `onchange="toggleBagagem(${it.idx})"` : 'disabled'} >
          <label>${it.item}</label>
        </div>`).join('')}
    </div>`).join('');
}

function renderOrcamento() {
  const alim = parseFloat(document.getElementById('orc_alimentacao').value) || 0;
  const pas = parseFloat(document.getElementById('orc_passeios').value) || 0;
  const ext = parseFloat(document.getElementById('orc_extras').value) || 0;
  const dias = Math.max(1, parseInt(document.getElementById('dias').value) || 1);
  let cChegada = 0, cConexao = 0, cVolta = 0, cH = 0;
  estado.cidades.forEach(c => {
    cChegada += c.transporte.reduce((s, t) => s + (t.custo || 0), 0);
    cH += c.hotel.reduce((s, h) => {
      if (h.checkin && h.checkout) {
        const d = Math.max(1, Math.ceil((new Date(h.checkout) - new Date(h.checkin)) / 86400000));
        return s + h.custo * d;
      }
      return s + h.custo;
    }, 0);
    if (c.conexao) cConexao += c.conexao.custo || 0;
    if (c.volta) cVolta += c.volta.custo || 0;
  });
  const tAlim = alim * dias;
  const totalTransporte = cChegada + cConexao + cVolta;
  const total = totalTransporte + cH + tAlim + pas + ext;
  document.getElementById('orcamento').innerHTML = `
    <div class="orcamento-item transporte"><div class="label">🚗 Transporte</div><div class="valor">R$ ${totalTransporte.toFixed(2)}</div></div>
    <div class="orcamento-item hotel"><div class="label">🏨 Hotel</div><div class="valor">R$ ${cH.toFixed(2)}</div></div>
    <div class="orcamento-item alimentacao"><div class="label">🍽️ Alimentação (${dias}d)</div><div class="valor">R$ ${tAlim.toFixed(2)}</div></div>
    <div class="orcamento-item passeios"><div class="label">🎟️ Passeios</div><div class="valor">R$ ${pas.toFixed(2)}</div></div>
    <div class="orcamento-item"><div class="label">🎁 Extras</div><div class="valor">R$ ${ext.toFixed(2)}</div></div>
    <div class="orcamento-item total"><div class="label">💰 TOTAL</div><div class="valor">R$ ${total.toFixed(2)}</div></div>
  `;
}

let dragIdx = null;
function onDragStart(e, idx) {
  if (!modoEdicao) { e.preventDefault(); return; }
  salvarRascunhos(); dragIdx = idx; e.currentTarget.classList.add('dragging');
}
function onDragOver(e) { if (!modoEdicao) return; e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function onDrop(e, idx) {
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if (!modoEdicao) return;
  if (dragIdx !== null && dragIdx !== idx) moverCidade(dragIdx, idx);
  dragIdx = null;
}
function onDragEnd(e) { e.currentTarget.classList.remove('dragging'); }

async function exportarPDF() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const pageW = 210, pageH = 297, margin = 15;
  let y = margin;
  const destino = document.getElementById('destino').value || 'Minha Viagem';
  const ida = document.getElementById('dataIda').value;
  const volta = document.getElementById('dataVolta').value;
  pdf.setFillColor(102, 126, 234); pdf.rect(0, 0, pageW, 35, 'F');
  pdf.setTextColor(255, 255, 255); pdf.setFontSize(22); pdf.setFont(undefined, 'bold');
  pdf.text('✈️ ' + destino, margin, 18);
  pdf.setFontSize(11); pdf.setFont(undefined, 'normal');
  pdf.text(`${formatarData(ida)} → ${formatarData(volta)}`, margin, 27);
  y = 45; pdf.setTextColor(0, 0, 0);
  const checkPage = (need = 10) => { if (y + need > pageH - margin) { pdf.addPage(); y = margin; } };

  for (let i = 0; i < estado.cidades.length; i++) {
    const c = estado.cidades[i];
    checkPage(40);
    pdf.setFillColor(240, 244, 255); pdf.rect(margin, y, pageW - 2*margin, 9, 'F');
    pdf.setFontSize(13); pdf.setFont(undefined, 'bold'); pdf.setTextColor(118, 75, 162);
    pdf.text(`${i+1}. ${c.nome}  (${formatarData(c.chegada)} → ${formatarData(c.saida)})`, margin + 3, y + 6);
    y += 14; pdf.setTextColor(0, 0, 0);

    if (i > 0 && c.conexao) {
      checkPage(8); pdf.setFontSize(10); pdf.setFont(undefined, 'bold');
      pdf.setTextColor(230, 81, 0);
      pdf.text('Conexão:', margin + 3, y); y += 5;
      pdf.setTextColor(0, 0, 0);
      pdf.setFont(undefined, 'normal'); pdf.setFontSize(9);
      let linha = `  • ${estado.cidades[i-1].nome} → ${c.nome} | ${c.conexao.tipo} ${c.conexao.empresa || ''} | ${formatarDataHora(c.conexao.data, c.conexao.hora)} | R$ ${c.conexao.custo.toFixed(2)}`;
      if (c.conexao.voucher) linha += ` | 🎟️ ${c.conexao.voucher}`;
      pdf.text(linha, margin + 5, y); y += 5;
      if (c.conexao.obs) {
        checkPage(5);
        pdf.setFont(undefined, 'italic'); pdf.setTextColor(120, 120, 120);
        pdf.text(`    ${c.conexao.obs}`, margin + 5, y); y += 5;
        pdf.setTextColor(0, 0, 0); pdf.setFont(undefined, 'normal');
      }
    }

    if (i === 0 && c.transporte.length) {
      checkPage(8); pdf.setFontSize(10); pdf.setFont(undefined, 'bold');
      pdf.text('Chegada:', margin + 3, y); y += 5;
      pdf.setFont(undefined, 'normal'); pdf.setFontSize(9);
      c.transporte.forEach(t => {
        checkPage(5);
        let linha = `  • ${t.tipo} ${t.empresa || ''} | ${formatarDataHora(t.data, t.hora)} | R$ ${t.custo.toFixed(2)}`;
        if (t.voucher) linha += ` | 🎟️ ${t.voucher}`;
        pdf.text(linha, margin + 5, y);
        y += 5;
      });
    }

    if (c.hotel.length) {
      checkPage(8); pdf.setFontSize(10); pdf.setFont(undefined, 'bold');
      pdf.text('Hospedagem:', margin + 3, y); y += 5;
      pdf.setFont(undefined, 'normal'); pdf.setFontSize(9);
      c.hotel.forEach(h => {
        checkPage(5);
        pdf.text(`  • ${h.nome} | ${h.end || '—'} | ${formatarData(h.checkin)} a ${formatarData(h.checkout)} | R$ ${h.custo.toFixed(2)}/noite`, margin + 5, y);
        y += 5;
      });
    }

    if (c.locais.length) {
      checkPage(8); pdf.setFontSize(10); pdf.setFont(undefined, 'bold');
      pdf.text('Locais:', margin + 3, y); y += 5;
      pdf.setFont(undefined, 'normal'); pdf.setFontSize(9);
      c.locais.forEach(l => {
        checkPage(5);
        pdf.text(`  • ${formatarData(l.data)} ${l.hora || ''} — ${l.nome} (${l.cat})`, margin + 5, y);
        y += 5;
      });
    }

    if (i === estado.cidades.length - 1 && c.volta) {
      checkPage(8); pdf.setFontSize(10); pdf.setFont(undefined, 'bold');
      pdf.setTextColor(239, 68, 68);
      pdf.text('Volta para casa:', margin + 3, y); y += 5;
      pdf.setTextColor(0, 0, 0);
      pdf.setFont(undefined, 'normal'); pdf.setFontSize(9);
      let linha = `  • ${c.volta.tipo} ${c.volta.empresa || ''} | ${formatarDataHora(c.volta.data, c.volta.hora)} | R$ ${c.volta.custo.toFixed(2)}`;
      if (c.volta.voucher) linha += ` | 🎟️ ${c.volta.voucher}`;
      pdf.text(linha, margin + 5, y);
      y += 5;
    }
    y += 5;
  }

  checkPage(30);
  pdf.setFillColor(240, 244, 255); pdf.rect(margin, y, pageW - 2*margin, 9, 'F');
  pdf.setFontSize(13); pdf.setFont(undefined, 'bold'); pdf.setTextColor(118, 75, 162);
  pdf.text('💰 Orçamento', margin + 3, y + 6);
  y += 14; pdf.setTextColor(0, 0, 0);
  pdf.setFontSize(10); pdf.setFont(undefined, 'normal');
  const alim = parseFloat(document.getElementById('orc_alimentacao').value) || 0;
  const pas = parseFloat(document.getElementById('orc_passeios').value) || 0;
  const ext = parseFloat(document.getElementById('orc_extras').value) || 0;
  const dias = Math.max(1, parseInt(document.getElementById('dias').value) || 1);
  let cChegada = 0, cConexao = 0, cVolta = 0, cH = 0;
  estado.cidades.forEach(c => {
    cChegada += c.transporte.reduce((s,t)=>s+(t.custo||0),0);
    cH += c.hotel.reduce((s,h)=>{
      if (h.checkin && h.checkout) {
        const d = Math.max(1, Math.ceil((new Date(h.checkout) - new Date(h.checkin))/86400000));
        return s + h.custo * d;
      }
      return s + h.custo;
    },0);
    if (c.conexao) cConexao += c.conexao.custo || 0;
    if (c.volta) cVolta += c.volta.custo || 0;
  });
  const tAlim = alim * dias;
  const totalTransporte = cChegada + cConexao + cVolta;
  const total = totalTransporte + cH + tAlim + pas + ext;
  [['Transporte', totalTransporte], ['Hotel', cH], [`Alimentação (${dias} dias)`, tAlim], ['Passeios', pas], ['Extras', ext], ['TOTAL', total]]
    .forEach(([n, v], idx, arr) => {
      checkPage(6);
      pdf.setFont(undefined, idx === arr.length - 1 ? 'bold' : 'normal');
      pdf.text(`${n}: R$ ${v.toFixed(2)}`, margin + 5, y);
      y += 6;
    });
  pdf.save(`viagem-${destino.replace(/\s+/g, '-').toLowerCase()}.pdf`);
}

function calcDias() {
  if (!modoEdicao) return;
  const ida = document.getElementById('dataIda').value;
  const volta = document.getElementById('dataVolta').value;
  if (ida && volta) {
    const d = Math.max(1, Math.ceil((new Date(volta) - new Date(ida)) / 86400000) + 1);
    document.getElementById('dias').value = d;
  }
}

// ===================== PWA =====================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
function atualizarBannerOffline() {
  const b = document.getElementById('bannerOffline');
  if (!b) return;
  if (navigator.onLine) b.classList.remove('ativo');
  else b.classList.add('ativo');
}
window.addEventListener('online', atualizarBannerOffline);
window.addEventListener('offline', atualizarBannerOffline);

// ===================== INIT =====================
carregarStore();
carregarFotoCache();
atualizarBannerOffline();
aplicarTema();
mostrarLista();
</script>
